<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .header {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      animation: slideDown 0.5s ease-out;
    }
    
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .header h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 5px;
    }
    
    .header p {
      color: #666;
      font-size: 14px;
    }
    
    .logout-btn {
      float: right;
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .logout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }
    
    .profile-card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      animation: slideUp 0.5s ease-out;
      text-align: center;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
      font-size: 48px;
      color: white;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
    }
    
    .name {
      color: #333;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    
    .email {
      color: #666;
      font-size: 18px;
      margin-bottom: 30px;
    }
    
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
      text-align: left;
    }
    
    .info-item {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .info-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
    }
    
    .info-label {
      color: #999;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    
    .info-value {
      color: #333;
      font-size: 18px;
      font-weight: 600;
    }
    
    .loading {
      text-align: center;
      padding: 60px;
      color: #666;
    }
    
    .error {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    
    .error h2 {
      color: #c33;
      margin-bottom: 15px;
    }
    
    .error p {
      color: #666;
      margin-bottom: 25px;
    }
    
    .error-btn {
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .error-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="logout-btn" onclick="logout()">Logout</button>
      <h1>My Profile</h1>
      <p>View and manage your account information</p>
    </div>
    
    <div id="content">
      <div class="loading">Loading profile...</div>
    </div>
  </div>
  
  <script>
    function logout() {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }
    
    async function loadProfile() {
      const token = localStorage.getItem('token');
      const contentDiv = document.getElementById('content');
      
      if (!token) {
        contentDiv.innerHTML = `
          <div class="error">
            <h2>Not Authenticated</h2>
            <p>Please sign in to view your profile</p>
            <a href="login.html" class="error-btn">Sign In</a>
          </div>
        `;
        return;
      }
      
      try {
        const response = await fetch('/api/auth/profile', {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
          },
        });
        
        if (response.ok) {
          const user = await response.json();
          
          const initial = user.name ? user.name.charAt(0).toUpperCase() : 'U';
          
          contentDiv.innerHTML = `
            <div class="profile-card">
              <div class="avatar">${initial}</div>
              <h2 class="name">${user.name || 'User'}</h2>
              <p class="email">${user.email}</p>
              
              <div class="info-grid">
                <div class="info-item">
                  <div class="info-label">User ID</div>
                  <div class="info-value">${user.id}</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Status</div>
                  <div class="info-value">Active</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Member Since</div>
                  <div class="info-value">${user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'N/A'}</div>
                </div>
              </div>
            </div>
          `;
        } else {
          contentDiv.innerHTML = `
            <div class="error">
              <h2>Error</h2>
              <p>Failed to load profile. Please try again.</p>
              <a href="login.html" class="error-btn">Go to Login</a>
            </div>
          `;
        }
      } catch (err) {
        contentDiv.innerHTML = `
          <div class="error">
            <h2>Connection Error</h2>
            <p>Unable to connect to the server. Please check your connection.</p>
            <button class="error-btn" onclick="loadProfile()">Retry</button>
          </div>
        `;
      }
    }
    
    loadProfile();
  </script>
</body>
</html>
